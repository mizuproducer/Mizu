name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          # Mizu app icon (water drop) over the default Capacitor icon
          cp -r android-res/. android/app/src/main/res/
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Mizu.apk

      - name: Save APK on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Mizu-apk
          path: Mizu.apk

      - name: Publish APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mizu build ${{ github.run_number }}
          body: Download Mizu.apk below on your Android phone and open it to install.
          files: Mizu.apk
